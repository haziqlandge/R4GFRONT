<!doctype html>
<html lang="en" data-theme="terminal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shruti · voice rag, measured</title>
<meta name="description" content="Speak a question, get a cited answer from MSMARCO-XI in under 200ms, or an honest refusal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap">
<link rel="stylesheet" href="/_shared/base.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="index.html">shruti</a>
    <span class="topbar-spacer"></span>
    <span class="brandmark" aria-label="OK4T">OK<span class="brandmark-star" aria-hidden="true">✦</span>T</span>
    <span class="topbar-spacer"></span>
    <span class="seg" role="group" aria-label="Answer mode">
      <button data-mode="fast" type="button">fast</button>
      <button data-mode="accurate" type="button">accurate</button>
    </span>
    <nav class="navlinks">
      <a class="btn" href="docs.html">docs</a>
      <a class="btn" href="https://github.com/haziqlandge/R4GFRONT" target="_blank" rel="noopener">repo <span aria-hidden="true">&#8599;</span></a>
    </nav>
  </header>

  <!-- One column of framed regions, read top to bottom like a session log. -->
  <main class="stack">
    <section class="win win-input">
      <h2 class="win-title">input</h2>
      <div class="win-body inputrow">
        <div class="miccol">
          <button class="mic" data-sh="mic" data-state="idle" aria-label="Start recording">
            <span class="mic-ring" data-sh="orb"></span>
            <span class="mic-label">rec</span>
          </button>
          <p class="mickey"><kbd>space</kbd></p>
        </div>
        <div class="inputcol">
          <p class="sh-state" data-sh="state">Ready</p>
          <p class="sh-transcript" data-sh="transcript"></p>
          <form class="sh-form" data-sh="form">
            <span class="prompt">&gt;</span>
            <input class="sh-input" data-sh="input" type="text"
                   placeholder="type a question in english or hindi"
                   aria-label="Type a question">
            <button class="btn btn-primary" type="submit">run</button>
          </form>
          <div class="sh-samples" data-sh="samples"></div>
        </div>
      </div>
    </section>

    <p class="sh-error" data-sh="error" role="alert" hidden></p>

    <section class="win win-output">
      <h2 class="win-title">output</h2>
      <div class="win-body" data-sh="answer"></div>
    </section>

    <!-- Its own frame on purpose. Nothing in here came from the corpus, nothing
         is cited, and it must never read as a continuation of the answer above. -->
    <section class="win win-aside" data-sh="aside" hidden>
      <h2 class="win-title">external</h2>
      <div class="win-body"></div>
    </section>

    <div class="cols">
      <div class="col">
        <!-- The title carries a two-state switch. MODEL is this project's
             pipeline; EXTERNAL is the hosted model's round trips. They were
             one number until 21 Aug, which meant a query routed to the model
             printed 630 ms under a heading that reads as the 200 ms claim. -->
        <section class="win">
          <h2 class="win-title">timing ·
            <button class="win-view" type="button" data-sh="timing-view">model</button>
          </h2>
          <div class="win-body">
            <div class="readout">
              <span class="readout-k" data-sh="total-k">pipeline</span>
              <span class="sh-num readout-v" data-sh="total">-</span>
              <span class="readout-k">speech</span>
              <span class="sh-num readout-v readout-v-dim" data-sh="stt">-</span>
            </div>
            <p class="boundary" data-sh="boundary">
              pipeline is the 200 ms claim. speech is a network call to sarvam and is
              timed on its own line, because you time from when you stop speaking.
            </p>
            <div data-sh="waterfall"></div>
          </div>
        </section>

        <section class="win win-console">
          <h2 class="win-title">console</h2>
          <div class="win-body" data-term></div>
        </section>
      </div>

      <section class="win">
        <h2 class="win-title">analytics ·
          <button class="win-view" type="button" data-sh="analytics-view">model</button>
        </h2>
        <div class="win-body" data-sh="analytics"></div>
      </section>
    </div>
  </main>

  <footer class="doc-footer">
    <a class="footprompt footlink" href="https://hhgoa.com" target="_blank" rel="noopener">ok4t\ragfront&gt;cd goa</a>
    <span class="topbar-spacer"></span>
    <a class="footlink" href="https://x.com/hashtag/RAGInGoa" target="_blank" rel="noopener">#RAGInGoa</a>
  </footer>
</div>

<script type="module">
  import { boot } from "/_shared/app.js";
  import { mountConsole } from "./console.js";
  boot();
  mountConsole(document.querySelector("[data-term]"));
</script>
</body>
</html>
